<!DOCTYPE html>
<html>
<head>
  <title>Fusion Energy per Gram Calculator</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    h1 { color: #333; }
    .calculator { background: #fff; padding: 20px; border-radius: 8px; width: 350px; }
    select, input, button { margin: 10px 0; width: 100%; padding: 8px; }
    .result { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Fusion Energy per Gram Calculator</h1>
  <div class="calculator">
    <label for="reaction">Choose Fusion Reaction:</label>
    <select id="reaction">
      <option value="DD">D-D (Deuterium-Deuterium)</option>
      <option value="DT">D-T (Deuterium-Tritium)</option>
      <option value="DHe3">D-He³ (Deuterium-Helium-3)</option>
    </select>

    <label for="mass">Mass of Fuel (grams):</label>
    <input type="number" id="mass" value="1" min="0.001" step="0.001">

    <button onclick="calculateEnergy()">Calculate Energy</button>
    <div class="result" id="output"></div>
  </div>

  <script>
    function calculateEnergy() {
      const reaction = document.getElementById("reaction").value;
      const mass = parseFloat(document.getElementById("mass").value);
      let energyPerGram = 0;

      if (reaction === "DD") energyPerGram = 1.0e11;   // J/g
      if (reaction === "DT") energyPerGram = 3.4e11;   // J/g
      if (reaction === "DHe3") energyPerGram = 3.5e11; // J/g

      const totalEnergy = energyPerGram * mass;
      document.getElementById("output").innerText =
        `Total Energy Released: ${totalEnergy.toExponential(3)} J`;
    }
  </script>
</body>
</html>
